[workspace]
resolver = "2"
members = [
    # compograph crates, grouped by layer.
    "crates/foundation/*",
    "crates/engine/*",
    "crates/render/*",
    "crates/app/*",
]

[workspace.package]
publish = true
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"

# gpui comes from the `gpui-pre` / `gpui-pre-platform` snapshots of Zed's
# crates on crates.io: the same snapshot crates gpui-kit pins, so both
# workspaces build against one GPUI API baseline. The requirements are exact
# on purpose — a caret requirement would let a newer snapshot move the build
# onto an API this project was never compiled against. Bump them together
# with the gpui-kit workspace pin. `gpui_platform` enables the desktop
# backends and macOS font/shader features exactly like gpui-kit does.
[workspace.dependencies]
compograph-geometry = { path = "crates/foundation/cg-geometry", version = "0.1.0" }
compograph-graph = { path = "crates/foundation/cg-graph", version = "0.1.0" }
compograph-interact = { path = "crates/render/cg-interact", version = "0.1.0" }
compograph-layout = { path = "crates/engine/cg-layout", version = "0.1.0" }
compograph-render = { path = "crates/render/cg-render", version = "0.1.0" }
compograph-types = { path = "crates/foundation/cg-types", version = "0.1.0" }

gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
