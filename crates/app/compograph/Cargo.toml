[package]
name = "compograph"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Desktop graph visualization application"
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "compograph"
path = "src/main.rs"

[dependencies]
compograph-graph.workspace = true
compograph-interact.workspace = true
compograph-layout.workspace = true
compograph-render.workspace = true
compograph-types.workspace = true
gpui.workspace = true
gpui_platform.workspace = true

[dev-dependencies]
# The test-support feature pulls in gpui's TestAppContext, which the
# background write-back tests need to drive the window without a display.
gpui = { workspace = true, features = ["test-support"] }
