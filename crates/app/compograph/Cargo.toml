[package]
name = "compograph"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "compograph"
path = "src/main.rs"

[dependencies]
cg-graph.workspace = true
cg-interact.workspace = true
cg-layout.workspace = true
cg-render.workspace = true
cg-types.workspace = true
gpui.workspace = true
gpui_platform.workspace = true

[dev-dependencies]
# The test-support feature pulls in gpui's TestAppContext, which the
# background write-back tests need to drive the window without a display.
gpui = { workspace = true, features = ["test-support"] }
