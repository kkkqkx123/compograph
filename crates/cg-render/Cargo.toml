[package]
name = "compograph-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Graph canvas rendering for compograph"
publish.workspace = true

[lints]
workspace = true

[dependencies]
compograph-geometry.workspace = true
compograph-graph.workspace = true
compograph-layout.workspace = true
compograph-types.workspace = true
gpui.workspace = true

[dev-dependencies]
# The test-support feature pulls in gpui's TestAppContext, which the
# subscription tests need to drive an application without a window.
gpui = { workspace = true, features = ["test-support"] }

[[bench]]
name = "scale"
harness = false

