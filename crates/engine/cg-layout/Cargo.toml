[package]
name = "cg-layout"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cg-graph.workspace = true
cg-types.workspace = true
gpui.workspace = true

[dev-dependencies]
# The test-support feature pulls in gpui's TestAppContext, which the
# subscription tests need to drive an application without a window.
gpui = { workspace = true, features = ["test-support"] }
