[package]
name = "cg-graph"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cg-types.workspace = true
gpui.workspace = true
petgraph.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["json-io"]
json-io = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
# The test-support feature pulls in gpui's TestAppContext, which the
# event sequence tests need to drive an application without a window.
gpui = { workspace = true, features = ["test-support"] }
